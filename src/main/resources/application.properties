# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.uploads.path=src/main/resources/static/uploads

# Face Recognition Service Configuration
app.face.api.url=http://localhost:8001
app.face.api.timeout=30000

# Feature extraction configuration
app.features.extraction.timeout=1800000
app.features.batch.size=10
app.features.quality.threshold=0.6
app.features.similarity.threshold=0.4

# Logging configuration for Python integration
logging.level.com.tathanhloc.faceattendance.Service.PythonFeatureExtractionService=DEBUG
logging.level.com.tathanhloc.faceattendance.Controller.PythonFeatureExtractionController=DEBUG


# WebSocket Configuration
spring.websocket.servlet.path=/ws

# CORS Configuration for Flask
spring.web.cors.allowed-origins=http://localhost:5000,http://127.0.0.1:5000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept
spring.web.cors.allow-credentials=true

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Face Recognition Settings
app.face.recognition.threshold=0.6
app.face.detection.threshold=0.5
app.face.min.size=40
app.face.max.size=1920

attendance.buffer.before.minutes=60
attendance.buffer.after.minutes=30
attendance.debug.enabled=true
logging.level.com.tathanhloc.faceattendance.Service.DiemDanhService=DEBUG


# ================================
# ERROR HANDLING CONFIGURATION
# ================================

# Enable detailed error messages in development (set to 'never' in production)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Custom error path
server.error.path=/error

# Enable NoHandlerFoundException to be thrown when no handler is found
spring.mvc.throw-exception-if-no-handler-found=true

# Disable default error whitelabel page
server.error.whitelabel.enabled=false

# Static resource handling
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/

# ================================
# FACE ATTENDANCE SYSTEM CONFIG
# ================================

# Custom error pages location
app.error.pages.location=classpath:/static/error/

# Email for error reporting (update this to your support email)
app.error.support.email=support@faceattendance.com

# Enable error tracking and monitoring
app.error.tracking.enabled=true

# Error page cache duration (in seconds)
app.error.cache.duration=300

# ================================
# LOGGING CONFIGURATION
# ================================

# Enable request logging for debugging (disable in production)
logging.level.org.springframework.web=DEBUG
logging.level.com.tathanhloc.faceattendance=DEBUG

# Log all HTTP requests (disable in production)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Error logging
logging.level.com.tathanhloc.faceattendance.Controller.CustomErrorController=INFO

# ================================
# ACTUATOR FOR HEALTH CHECKS
# ================================

# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,error
management.endpoint.health.show-details=when_authorized

# Health check endpoint security
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState

# ================================
# SECURITY CONFIGURATION
# ================================

# Enable CORS for frontend integration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ================================
# DEVELOPMENT vs PRODUCTION
# ================================

# Development profile settings
---
spring.config.activate.on-profile=dev,development

# Detailed error messages for development
server.error.include-stacktrace=always
server.error.include-exception=true
logging.level.org.springframework.web=DEBUG

# Development CORS (more permissive)
spring.web.cors.allowed-origins=*

---
# Production profile settings
spring.config.activate.on-profile=prod,production

# Minimal error information for production
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Production logging (less verbose)
logging.level.org.springframework.web=WARN
logging.level.com.tathanhloc.faceattendance=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN

# Restricted CORS for production
spring.web.cors.allowed-origins=https://yourdomain.com,https://app.yourdomain.com

# Secure cookies for production
server.servlet.session.cookie.secure=true

# ================================
# ADDITIONAL CONFIGURATIONS
# ================================

# Enable pretty JSON response formatting
spring.jackson.serialization.indent_output=true

# Request timeout settings
server.servlet.session.timeout=30m
spring.transaction.default-timeout=30

# File upload limits (if needed for face images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB